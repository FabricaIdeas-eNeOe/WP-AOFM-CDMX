<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Temporada 2026–2027</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

/* =========================
   BODY
   ========================= */

body{
  margin:0;
  font-family:'Montserrat',sans-serif;

  background:
    linear-gradient(rgba(255,255,255,0.25), rgba(255,255,255,0.15)),
    url('background.png');

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
}


/* =========================
   HEADER
   ========================= */

.header{
  text-align:center;
  padding:80px 20px 40px;
}

.title{
  display:inline-block;

  font-size:42px;
  font-weight:800;

  color:#0a4f73;

  padding:18px 60px;

  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(25px);

  border-radius:30px;

  border:1px solid rgba(255,255,255,0.6);

  position:relative;
  overflow:hidden;
}

.title::before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      120deg,
      transparent 30%,
      rgba(255,255,255,0.6) 50%,
      transparent 70%
    );

  animation:wave 3s infinite linear;
}

@keyframes wave{

  0%{
    transform:translateX(-100%);
  }

  100%{
    transform:translateX(100%);
  }

}


/* =========================
   SUBTITLE
   ========================= */

.subtitle{
  margin-top:12px;

  font-size:15px;

  color:#5c7f91;
}


/* =========================
   SECTION TITLE
   ========================= */

.section-title{

  max-width:1200px;

  margin:0 auto;

  padding:0 20px;

  font-size:18px;

  font-weight:600;

  color:#0a4f73;

  text-align:left;
}


/* =========================
   GRID
   ========================= */

.grid{

  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

  gap:40px;

  max-width:1200px;

  margin:0 auto;

  padding:30px 20px 140px;
}


/* =========================
   CARDS
   ========================= */

.card{

  text-decoration:none;

  color:inherit;

  border-radius:28px;

  overflow:hidden;

  background:
    rgba(255,255,255,0.28);

  backdrop-filter:blur(18px);

  box-shadow:
    0 20px 45px rgba(0,0,0,0.25),
    inset 0 1px 6px rgba(255,255,255,0.6);

  transition:0.35s;
}

.card:hover{

  transform:
    translateY(-8px)
    scale(1.02);
}


/* =========================
   CARD IMAGE
   ========================= */

.card img{

  width:100%;

  height:220px;

  object-fit:cover;

  display:block;
}


/* =========================
   CARD CONTENT
   ========================= */

.card-content{

  padding:20px;

  text-align:center;
}

.card-content h3{

  margin:0;

  font-size:20px;

  color:#0a4f73;
}

.card-content p{

  margin:8px 0 0;

  font-size:14px;

  opacity:0.75;
}


/* =========================
   FOOTER
   ========================= */

.footer{

  position:fixed;

  bottom:0;

  width:100%;

  text-align:center;

  padding:10px;

  background:
    rgba(255,255,255,0.85);

  backdrop-filter:blur(12px);
}

.footer img{

  height:36px;

  margin:0 8px;
}


/* =========================
   HIDDEN ADMIN AREAS
   ========================= */

.admin-bottom-right{

  position:fixed;

  bottom:0;

  right:0;

  width:80px;

  height:60px;

  opacity:0;
}

.admin-top-left{

  position:fixed;

  top:0;

  left:0;

  width:80px;

  height:60px;

  opacity:0;
}

.admin-top-right{

  position:fixed;

  top:0;

  right:0;

  width:80px;

  height:60px;

  opacity:0;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width:600px){

  body{

    background-attachment:scroll;
  }

  .header{

    padding:60px 20px 30px;
  }

  .title{

    font-size:28px;

    padding:14px 30px;
  }

  .subtitle{

    font-size:13px;
  }

  .grid{

    gap:25px;
  }

  .card img{

    height:180px;
  }

}

</style>

</head>

<body>


<!-- HEADER -->

<div class="header">

  <div class="title">
    Temporada 2026–2027
  </div>

  <div class="subtitle">
    Calendario de competencias y eventos
  </div>

</div>


<!-- EVENTS -->

<div class="section-title">
  Eventos
</div>


<div class="grid">


  <!-- COPA METROPOLITANA -->

  <a
    href="gallery.html?folder=WP2026-27%2FMETROSEP2026%2FAOFM1%2Fgallery&title=Copa%20Metropolitana%202026%20%C2%B7%20AOFM1&cover=METROSEP26_AOFM_OLIMP_0905_004"
    class="card"
  >

    <img
      src="https://res.cloudinary.com/du4pmuch7/image/upload/METROSEP26_AOFM_OLIMP_0905_004.jpg"
      alt="Copa Metropolitana 2026"
    >

    <div class="card-content">

      <h3>
        Copa Metropolitana 2026
      </h3>

      <p>
        Liga Metropolitana Q3 · Sep 2026
      </p>

    </div>

  </a>


</div>


<!-- FOOTER -->

<div class="footer">

  <img src="logo-aofm.png">

  <img src="logo-club.png">

  <img src="logo-olimpicos.png">

</div>


<!-- HIDDEN ADMIN AREAS -->

<div
  class="admin-bottom-right"
  onclick="window.location='index.html'"
></div>

<div
  class="admin-top-left"
  onclick="window.location='index.html'"
></div>

<div
  class="admin-top-right"
  onclick="window.location.reload()"
></div>


</body>

</html>
