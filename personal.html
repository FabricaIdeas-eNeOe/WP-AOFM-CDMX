<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:'Montserrat',sans-serif;

  background:
    linear-gradient(
      rgba(255,255,255,0.25),
      rgba(255,255,255,0.15)
    ),
    url('background.png');

  background-size:cover;
  background-attachment:fixed;
  color:#0a4f73;
}

/* =========================
   PASSWORD SCREEN
   ========================= */

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
}

.login-box{
  width:min(430px,100%);
  padding:45px 35px;
  text-align:center;

  background:rgba(255,255,255,0.45);
  border:1px solid rgba(255,255,255,0.6);
  border-radius:30px;

  backdrop-filter:blur(15px);
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
}

.login-box h1{
  margin:0 0 10px;
  font-size:32px;
  font-weight:800;
}

.login-box p{
  margin:0 0 25px;
  color:#456;
}

.password{
  width:100%;
  padding:14px 18px;
  border:none;
  border-radius:20px;

  background:rgba(255,255,255,0.8);
  font-family:'Montserrat',sans-serif;
  font-size:16px;
  outline:none;
}

.enter{
  margin-top:15px;
  padding:12px 28px;

  border:none;
  border-radius:20px;

  background:#0a4f73;
  color:white;

  font-family:'Montserrat',sans-serif;
  font-weight:600;
  cursor:pointer;
}

.enter:hover{
  opacity:.9;
}

.error{
  margin-top:15px;
  color:#b00020;
  font-size:14px;
  display:none;
}


/* =========================
   PERSONAL HOME
   ========================= */

#personal{
  display:block;
}

.header{
  text-align:center;
  padding:60px 20px 30px;
}

.title{
  display:inline-block;

  font-size:32px;
  font-weight:800;

  color:#0a4f73;

  padding:14px 40px;

  background:rgba(255,255,255,0.30);
  border-radius:25px;
}

.subtitle{
  margin-top:15px;
  color:#52758a;
}


/* =========================
   SECTIONS
   ========================= */

.sections{
  max-width:1000px;
  margin:0 auto;
  padding:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(
    auto-fit,
    minmax(280px,1fr)
  );

  gap:25px;
}

.card{
  display:block;

  background:rgba(255,255,255,0.45);

  border-radius:25px;
  overflow:hidden;

  cursor:pointer;

  backdrop-filter:blur(10px);

  box-shadow:
    0 15px 40px rgba(0,0,0,0.10);

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.card:hover{
  transform:translateY(-6px);

  box-shadow:
    0 20px 50px rgba(0,0,0,0.16);
}

.card-image{
  height:220px;

  background-size:cover;
  background-position:center;
}

.card-content{
  padding:22px;
  text-align:center;
}

.card-content h2{
  margin:0 0 8px;

  color:#0a4f73;

  font-size:24px;
  font-weight:800;
}

.card-content p{
  margin:0;
  color:#456;
}


/* =========================
   GALLERY
   ========================= */

.gallery-page{
  display:none;
}

.gallery-header{
  text-align:center;
  padding:35px 20px 20px;
}

.back{
  display:inline-block;

  margin-bottom:20px;

  padding:9px 18px;

  border:none;
  border-radius:20px;

  background:rgba(255,255,255,0.55);
  color:#0a4f73;

  font-family:'Montserrat',sans-serif;
  font-weight:600;

  cursor:pointer;
}

.gallery-title{
  margin:0;

  font-size:30px;
  font-weight:800;
}

.gallery-grid{
  padding:20px;

  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(160px,1fr));

  gap:10px;

  max-width:1400px;
  margin:auto;
}

.gallery-grid img{
  width:100%;
  height:160px;

  object-fit:cover;

  border-radius:12px;

  cursor:pointer;

  transition:transform .2s ease;
}

.gallery-grid img:hover{
  transform:scale(1.02);
}


/* =========================
   LIGHTBOX
   ========================= */

.lightbox{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.95);

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:99999;

  opacity:0;
  pointer-events:none;

  transition:opacity .3s;

  /* IMPORTANT FOR MOBILE GESTURES */
  touch-action:none;
  overscroll-behavior:none;
}

.lightbox.active{
  opacity:1;
  pointer-events:auto;
}

.lightbox img{
  max-width:95%;
  max-height:90%;

  border-radius:10px;

  transform-origin:center;

  transition:transform .15s ease;

  /* IMPORTANT FOR MOBILE GESTURES */
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-user-drag:none;
}

.close{
  position:absolute;

  top:20px;
  left:20px;

  color:white;

  font-size:28px;
  line-height:1;

  cursor:pointer;
  user-select:none;

  z-index:10;

  width:44px;
  height:44px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;
  background:rgba(255,255,255,.12);
}

.lightbox-prev,
.lightbox-next{
  position:absolute;

  top:50%;
  transform:translateY(-50%);

  width:48px;
  height:72px;

  border:0;
  border-radius:16px;

  background:rgba(255,255,255,.14);
  color:white;

  font-size:52px;
  line-height:1;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
  user-select:none;

  z-index:10;

  padding:0;

  backdrop-filter:blur(6px);
}

.lightbox-prev{
  left:18px;
}

.lightbox-next{
  right:18px;
}

.lightbox-prev:active,
.lightbox-next:active,
.close:active{
  background:rgba(255,255,255,.28);
}


/* =========================
   BODY LOCK
   ========================= */

body.lightbox-open{
  overflow:hidden;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

  .title{
    font-size:25px;
    padding:12px 25px;
  }

  .gallery-grid{
    grid-template-columns:
      repeat(auto-fill,minmax(110px,1fr));
  }

  .gallery-grid img{
    height:110px;
  }

  .lightbox img{
    max-width:88%;
    max-height:82%;
  }

  .lightbox-prev,
  .lightbox-next{
    width:42px;
    height:58px;

    font-size:42px;

    border-radius:14px;
  }

  .lightbox-prev{
    left:8px;
  }

  .lightbox-next{
    right:8px;
  }

  .close{
    top:12px;
    left:12px;
  }

}
</style>
</head>


<body>


<!-- =========================
     PERSONAL HOME
     ========================= -->

<div id="personal">

  <div class="header">

    <div class="title">
      Personal Gallery
    </div>

    <div class="subtitle">
      Fotografías personales
    </div>

  </div>


  <div class="sections">

    <div class="cards">

      <!-- VIAJE -->

      <div
        class="card"
        onclick="openGallery('viaje')">

        <div
          id="viajeCover"
          class="card-image">
        </div>

        <div class="card-content">

          <h2>📸 Viaje</h2>

          <p>
            Fotografías de viaje
          </p>

        </div>

      </div>


      <!-- EMILIO -->

      <div
        class="card"
        onclick="openGallery('emilio')">

        <div
          id="emilioCover"
          class="card-image">
        </div>

        <div class="card-content">

          <h2>👦 Emilio</h2>

          <p>
            Fotografías personales
          </p>

        </div>

      </div>

    </div>

  </div>

</div>


<!-- =========================
     GALLERY PAGE
     ========================= -->

<div id="galleryPage" class="gallery-page">

  <div class="gallery-header">

    <button
      class="back"
      onclick="backHome()">
      ← Volver
    </button>

    <h1
      id="galleryTitle"
      class="gallery-title">
    </h1>

  </div>

  <div
    id="galleryGrid"
    class="gallery-grid">
  </div>

</div>


<!-- =========================
     LIGHTBOX
     ========================= -->

<div
  id="lightbox"
  class="lightbox">

  <div
    class="close"
    onclick="closeLightbox()">
    ×
  </div>

  <button
    class="lightbox-prev"
    onclick="prev()"
    aria-label="Fotografía anterior">
    ‹
  </button>

  <img
    id="lightboxImg"
    draggable="false">

  <button
    class="lightbox-next"
    onclick="next()"
    aria-label="Fotografía siguiente">
    ›
  </button>

</div>


<script>

/* =========================
   CONFIGURATION
   ========================= */

const cloud="du4pmuch7";

const API="/api/images";


/* =========================
   AUTHENTICATED ENTRY
   ========================= */

/*
   personal.html is already protected
   by Vercel middleware.

   If this page is being displayed,
   the personal session cookie has already
   been accepted by the server.

   Therefore we load the private gallery
   directly. No password or sessionStorage
   is used here.
*/

window.addEventListener("DOMContentLoaded",function(){

  loadCovers();

});


/* =========================
   LOAD COVERS
   ========================= */


/* =========================
   LOAD COVERS
   ========================= */

async function loadCovers(){

  try{

    const viaje =
      await getImages("ENEOE/Viaje");

    const emilio =
      await getImages("ENEOE/Emilio");


    if(viaje.length){

      document.getElementById(
        "viajeCover"
      ).style.backgroundImage =
        `url(https://res.cloudinary.com/${cloud}/image/upload/w_800/${viaje[0]}.jpg)`;

    }


    if(emilio.length){

      document.getElementById(
        "emilioCover"
      ).style.backgroundImage =
        `url(https://res.cloudinary.com/${cloud}/image/upload/w_800/${emilio[0]}.jpg)`;

    }

  }catch(error){

    console.error(
      "Error loading covers:",
      error
    );

  }

}


/* =========================
   GET IMAGES
   ========================= */

async function getImages(folder){

  const res =
    await fetch(
      `${API}?folder=${encodeURIComponent(folder)}`
    );

  if(!res.ok){

    throw new Error(
      "API error"
    );

  }

  const images =
    await res.json();

  return images;

}


/* =========================
   OPEN GALLERY
   ========================= */

async function openGallery(type){

  const folder =
    type === "viaje"
      ? "ENEOE/Viaje"
      : "ENEOE/Emilio";


  const title =
    type === "viaje"
      ? "📸 Fotos de Viaje"
      : "👦 Fotos de Emilio";


  document.getElementById(
    "personal"
  ).style.display="none";


  document.getElementById(
    "galleryPage"
  ).style.display="block";


  document.getElementById(
    "galleryTitle"
  ).innerText=title;


  const grid =
    document.getElementById(
      "galleryGrid"
    );


  grid.innerHTML =
    "Cargando fotografías...";


  try{

    const images =
      await getImages(folder);


    grid.innerHTML="";


    images.forEach((id,index)=>{

      const img =
        new Image();

      img.src =
        `https://res.cloudinary.com/${cloud}/image/upload/w_500/${id}.jpg`;

      img.loading="lazy";

      img.onclick=()=>{
        openLightbox(images,index);
      };

      grid.appendChild(img);

    });


  }catch(error){

    grid.innerHTML =
      "No fue posible cargar las fotografías.";

    console.error(error);

  }

}


/* =========================
   BACK
   ========================= */

function backHome(){

  document.getElementById(
    "galleryPage"
  ).style.display="none";


  document.getElementById(
    "personal"
  ).style.display="block";

}


/* =========================
   LIGHTBOX
   ========================= */

const lightbox =
  document.getElementById(
    "lightbox"
  );

const lightboxImg =
  document.getElementById(
    "lightboxImg"
  );


let currentImages=[];
let currentIndex=0;


/* =========================
   ZOOM / TOUCH STATE
   ========================= */

let scale=1;

let posX=0;
let posY=0;

let touchStartX=0;
let touchStartY=0;

let lastTouchX=0;
let lastTouchY=0;

let pinchStartDistance=0;
let pinchStartScale=1;

let isPinching=false;
let isDragging=false;

let lastTapTime=0;


/* =========================
   OPEN LIGHTBOX
   ========================= */

function openLightbox(images,index){

  currentImages=images;
  currentIndex=index;

  resetZoom();
  showImage();

  lightbox.classList.add("active");

  document.body.classList.add(
    "lightbox-open"
  );

}


/* =========================
   SHOW IMAGE
   ========================= */

function showImage(){

  if(
    !currentImages ||
    !currentImages.length
  ){
    return;
  }

  const id =
    currentImages[currentIndex];

  const url =
    `https://res.cloudinary.com/${cloud}/image/upload/${id}.jpg`;

  lightboxImg.src=url;


  /* PRELOAD NEXT */

  const nextImage =
    new Image();

  nextImage.src =
    `https://res.cloudinary.com/${cloud}/image/upload/${currentImages[(currentIndex+1)%currentImages.length]}.jpg`;

}


/* =========================
   CLOSE LIGHTBOX
   ========================= */

function closeLightbox(){

  lightbox.classList.remove(
    "active"
  );

  document.body.classList.remove(
    "lightbox-open"
  );

  resetZoom();

}


/* =========================
   NAVIGATION
   ========================= */

function next(){

  if(
    !currentImages ||
    !currentImages.length
  ){
    return;
  }

  currentIndex =
    (currentIndex + 1)
    % currentImages.length;

  resetZoom();
  showImage();

}


function prev(){

  if(
    !currentImages ||
    !currentImages.length
  ){
    return;
  }

  currentIndex =
    (currentIndex - 1 +
     currentImages.length)
    % currentImages.length;

  resetZoom();
  showImage();

}


/* =========================
   PINCH DISTANCE
   ========================= */

function getPinchDistance(touches){

  const dx =
    touches[0].clientX -
    touches[1].clientX;

  const dy =
    touches[0].clientY -
    touches[1].clientY;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =========================
   TOUCH START
   ========================= */

lightbox.addEventListener(
  "touchstart",
  function(e){

    if(!lightbox.classList.contains("active")){
      return;
    }


    /* TWO FINGERS = PINCH */

    if(e.touches.length === 2){

      isPinching=true;
      isDragging=false;

      pinchStartDistance =
        getPinchDistance(
          e.touches
        );

      pinchStartScale=scale;

      return;

    }


    /* ONE FINGER */

    if(e.touches.length !== 1){
      return;
    }

    touchStartX =
      e.touches[0].clientX;

    touchStartY =
      e.touches[0].clientY;

    lastTouchX=touchStartX;
    lastTouchY=touchStartY;

    isDragging=false;

  },
  {passive:false}
);


/* =========================
   TOUCH MOVE
   ========================= */

lightbox.addEventListener(
  "touchmove",
  function(e){

    /* PINCH */

    if(
      e.touches.length === 2 &&
      pinchStartDistance > 0
    ){

      e.preventDefault();

      const distance =
        getPinchDistance(
          e.touches
        );

      scale =
        pinchStartScale *
        (distance / pinchStartDistance);

      scale =
        Math.min(
          4,
          Math.max(
            1,
            scale
          )
        );

      applyTransform();

      return;

    }


    /* DRAG ONLY WHEN ZOOMED */

    if(
      e.touches.length === 1 &&
      scale > 1
    ){

      e.preventDefault();

      const x =
        e.touches[0].clientX;

      const y =
        e.touches[0].clientY;

      posX +=
        x - lastTouchX;

      posY +=
        y - lastTouchY;

      lastTouchX=x;
      lastTouchY=y;

      isDragging=true;

      applyTransform();

    }

  },
  {passive:false}
);


/* =========================
   TOUCH END
   ========================= */

lightbox.addEventListener(
  "touchend",
  function(e){

    /* END OF PINCH */

    if(isPinching){

      if(e.touches.length === 0){

        isPinching=false;
        pinchStartDistance=0;

      }

      return;

    }


    if(e.changedTouches.length !== 1){
      return;
    }


    const endX =
      e.changedTouches[0].clientX;

    const endY =
      e.changedTouches[0].clientY;


    const deltaX =
      endX - touchStartX;

    const deltaY =
      endY - touchStartY;


    const distance =
      Math.sqrt(
        deltaX * deltaX +
        deltaY * deltaY
      );


    /* =====================
       SWIPE
       ===================== */

    if(
      scale === 1 &&
      !isDragging &&
      Math.abs(deltaX) >= 60 &&
      Math.abs(deltaX) >
        Math.abs(deltaY)
    ){

      if(deltaX < 0){

        next();

      }else{

        prev();

      }

      lastTapTime=0;

      return;

    }


    /* =====================
       TAP / DOUBLE TAP
       ===================== */

    if(
      !isDragging &&
      distance < 20
    ){

      const now =
        Date.now();

      if(
        now - lastTapTime <
        350
      ){

        if(scale === 1){

          scale=2;

        }else{

          resetZoom();

        }

        applyTransform();

        lastTapTime=0;

        return;

      }

      lastTapTime=now;

    }

  },
  {passive:false}
);


/* =========================
   TRANSFORM
   ========================= */

function applyTransform(){

  lightboxImg.style.transform =
    `translate(${posX}px, ${posY}px) scale(${scale})`;

}


/* =========================
   RESET ZOOM
   ========================= */

function resetZoom(){

  scale=1;

  posX=0;
  posY=0;

  isDragging=false;
  isPinching=false;

  pinchStartDistance=0;

  applyTransform();

}


/* =========================
   KEYBOARD
   ========================= */

document.addEventListener(
  "keydown",
  function(e){

    if(
      !lightbox.classList.contains(
        "active"
      )
    ){
      return;
    }


    if(e.key === "ArrowRight"){
      next();
    }


    if(e.key === "ArrowLeft"){
      prev();
    }


    if(e.key === "Escape"){
      closeLightbox();
    }

  }
);


/* =========================
   CLOSE BY BACKGROUND
   ========================= */

lightbox.addEventListener(
  "click",
  function(e){

    if(e.target === lightbox){

      closeLightbox();

    }

  }
);

</script>

</body>
</html>
